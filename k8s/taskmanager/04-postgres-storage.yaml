apiVersion: v1
kind: PersistentVolume
metadata:
  name: taskmanager-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  # Preserve database files when the claim is deleted.
  persistentVolumeReclaimPolicy: Retain
  # Bind to the static NFS volume instead of the default provisioner.
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
  nfs:
    server: "{{ site.lab.address }}"
    path: "{{ site.postgres.directory }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskmanager-postgres-pvc
  namespace: taskmanager
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: taskmanager-postgres-pv
