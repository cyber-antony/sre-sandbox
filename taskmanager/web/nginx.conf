server {
  listen 80; 	# Default HTTP port.
  server_name localhost; 	# Server name.


  location / { 	# Serve frontend requests.
    root /usr/share/nginx/html; 	# Static file directory.
    index index.html; 	# Default page.
  }


  location /api/ { 	# Forward API requests to the backend.
    proxy_pass http://taskmanager:6000/api/; 	# Resolve the backend service on the Compose network.
    proxy_set_header Host $host; 	# Preserve the original Host header.
    proxy_set_header X-Real-IP $remote_addr; 	# Forward the client IP address.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;	# Append the client IP to the proxy chain.
    proxy_set_header X-Forwarded-Proto $scheme;	# Forward the original request scheme.
  }
}
