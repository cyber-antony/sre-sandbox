<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1240" viewBox="0 0 1660 1240"><defs><marker id="arrow64748b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="arrow7c3aed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed" /></marker><marker id="arrow3b82f6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6" /></marker></defs><rect width="1660" height="1240" fill="#f8fafc" /><rect x="40" y="25" width="1580" height="55" rx="12" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5" /><rect x="40" y="90" width="1580" height="45" rx="12" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5" /><rect x="550" y="170" width="580" height="145" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><rect x="70" y="440" width="500" height="155" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" /><rect x="830" y="440" width="730" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><rect x="830" y="700" width="730" height="160" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" /><rect x="70" y="920" width="500" height="145" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><rect x="830" y="980" width="730" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><rect x="70" y="1140" width="1490" height="65" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" /><line x1="320" y1="440" x2="320" y2="350" stroke="#7c3aed" stroke-width="2" /><line x1="320" y1="350" x2="695" y2="350" stroke="#7c3aed" stroke-width="2" /><line x1="695" y1="350" x2="695" y2="315" stroke="#7c3aed" stroke-width="2" /><polygon points="695,315 700.0,327.0 690.0,327.0" fill="#7c3aed" /><text x="707" y="338" fill="#7c3aed" font-size="13" font-family="DejaVu Sans, sans-serif" paint-order="stroke" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round">local backing file</text><line x1="1195" y1="440" x2="1195" y2="350" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 5" /><line x1="1195" y1="350" x2="985" y2="350" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 5" /><line x1="985" y1="350" x2="985" y2="315" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 5" /><polygon points="985,315 990.0,327.0 980.0,327.0" fill="#3b82f6" /><text x="997" y="338" fill="#3b82f6" font-size="13" font-family="DejaVu Sans, sans-serif" paint-order="stroke" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round">read-only NFS</text><line x1="1195" y1="700" x2="1195" y2="570" stroke="#7c3aed" stroke-width="2" /><polygon points="1195,570 1200.0,582.0 1190.0,582.0" fill="#7c3aed" /><text x="1207" y="558" fill="#7c3aed" font-size="13" font-family="DejaVu Sans, sans-serif" paint-order="stroke" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round">node backing file</text><line x1="570" y1="517" x2="690" y2="517" stroke="#64748b" stroke-width="2" /><line x1="690" y1="517" x2="690" y2="780" stroke="#64748b" stroke-width="2" /><line x1="690" y1="780" x2="830" y2="780" stroke="#64748b" stroke-width="2" /><polygon points="830,780 818.0,785.0 818.0,775.0" fill="#64748b" /><text x="702" y="768" fill="#64748b" font-size="13" font-family="DejaVu Sans, sans-serif" paint-order="stroke" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round">contains files</text><line x1="830" y1="1030" x2="570" y2="1030" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 5" /><polygon points="570,1030 582.0,1025.0 582.0,1035.0" fill="#3b82f6" /><text x="582" y="1018" fill="#3b82f6" font-size="13" font-family="DejaVu Sans, sans-serif" paint-order="stroke" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round">NFS data writes</text><text x="56" y="54" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600">SRE Sandbox | Disk dependencies and lifetime</text><text x="56" y="119" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">Purple arrows: overlay -&gt; backing file. Blue dashed arrows: NFS. Grey arrow: filesystem containment.</text><text x="566" y="199" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">L0 / lab | persistent base image</text><text x="566" y="221" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">/srv/vm-images/ubuntu-24.04-server-cloudimg-amd64.img</text><text x="566" y="243" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Used locally for mainhost and remotely for the cluster nodes.</text><text x="566" y="265" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Do not remove or replace while dependent overlays are in use.</text><text x="86" y="469" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">L0 file / L1 root disk</text><text x="86" y="491" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">/var/lib/libvirt/images/mainhost.qcow2</text><text x="86" y="513" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">120G virtual; writable overlay</text><text x="86" y="535" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Its guest filesystem contains the node disk files.</text><text x="846" y="469" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">L1 / mainhost | read-only NFS mount</text><text x="846" y="491" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">/mnt/vm-images/ubuntu-24.04-server-cloudimg-amd64.img</text><text x="846" y="513" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">NFS view of the same physical base file on lab.</text><text x="846" y="729" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">L1 files / L2 root disks</text><text x="846" y="751" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">/opt/sre-lab/libvirt/vm-disks/</text><text x="846" y="773" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">cc1.qcow2 | wk1.qcow2 | wk2.qcow2</text><text x="846" y="795" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Each node overlay refers to the base image at the mounted NFS path.</text><text x="846" y="817" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Each has its own cloud-init seed.iso; seed ISOs are not backing images.</text><text x="86" y="949" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">L0 / lab | PostgreSQL persistent files</text><text x="86" y="971" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">/srv/postgres/taskmanager-postgres</text><text x="86" y="993" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Independent of mainhost and node root disks.</text><text x="86" y="1015" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">PV reclaim policy: Retain.</text><text x="846" y="1009" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">Kubernetes PostgreSQL container</text><text x="846" y="1031" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">PV/PVC mounts the NFS subdirectory.</text><text x="846" y="1053" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Scheduling does not change the physical storage location.</text><text x="86" y="1169" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">Deleting mainhost.qcow2 also loses its nested VM disk files. Deleting node overlays loses node-local state.</text><text x="86" y="1191" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">PostgreSQL files and the base image remain on lab. Virtual disk capacities are not preallocated physical usage.</text></svg>
