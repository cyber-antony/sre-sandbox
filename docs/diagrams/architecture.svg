e="#3b82f6" stroke-width="2" stroke-dasharray="8 5" /><polygon points="570,1007 558.0,1012.0 558.0,1002.0" fill="#3b82f6" /><text x="56" y="54" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600">SRE Sandbox | Machines and disks</text><text x="56" y="119" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">Reference layout; configure sizes and paths in your environment | Solid boundaries show nesting; dashed arrows show NFS access.</text><text x="56" y="179" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600">L0 | lab - physical KVM/libvirt host</text><text x="81" y="249" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600">Physical host filesystem / services</text><text x="101" y="309" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Persistent base image</text><text x="101" y="330" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">/srv/vm-images</text><text x="101" y="351" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">ubuntu-24.04-server-cloudimg-amd64.img</text><text x="101" y="372" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Shared backing file; not a VM disk copy.</text><text x="101" y="489" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Mainhost root disk | 120G virtual</text><text x="101" y="510" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">/var/lib/libvirt/images/</text><text x="101" y="531" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">mainhost.qcow2</text><text x="101" y="552" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Writable overlay backed by the base image.</text><text x="101" y="649" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Mainhost cloud-init CD-ROM</text><text x="101" y="670" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">/var/lib/libvirt/images/mainhost-seed.iso</text><text x="101" y="691" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Source: /var/lib/libvirt/cloud-init/mainhost</text><text x="101" y="799" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Persistent PostgreSQL data (NFS RW)</text><text x="101" y="820" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">/srv/postgres/taskmanager-postgres</text><text x="101" y="841" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Physical storage stays on lab.</text><text x="101" y="862" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">PV / PVC declared capacity: 5Gi.</text><text x="101" y="959" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">APT package cache</text><text x="101" y="980" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">apt-cacher-ng outside disposable VMs</text><text x="101" y="1001" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Endpoint from site.apt_proxy.url</text><text x="561" y="249" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600">L1 | mainhost - infrastructure VM</text><text x="586" y="309" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">Nested KVM/libvirt | 4 vCPUs | 6656 MiB RAM</text><text x="586" y="331" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">LAN bridge on lab -&gt; mainhost -&gt; internal bridge brk3s -&gt; cluster VMs</text><text x="586" y="394" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">Guest filesystem inside mainhost.qcow2</text><text x="586" y="416" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Node disk files: /opt/sre-lab/libvirt/vm-disks/</text><text x="586" y="438" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">cc1.qcow2 | wk1.qcow2 | wk2.qcow2 (each 30G virtual in this configuration)</text><text x="586" y="460" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Node cloud-init: /opt/sre-lab/libvirt/cloud-init/&lt;node&gt;/seed.iso</text><text x="586" y="482" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">These files are stored inside mainhost, not directly alongside mainhost.qcow2 on lab.</text><text x="586" y="569" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">Read-only NFS mount: /mnt/vm-images</text><text x="586" y="591" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">ubuntu-24.04-server-cloudimg-amd64.img | Same base image exported by lab; node overlays depend on this mount.</text><text x="586" y="694" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">L2 | cc1 - control plane</text><text x="601" y="749" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">2 vCPUs | 1500 MiB RAM</text><text x="601" y="770" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">k3s server</text><text x="601" y="819" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Virtual root disk | 30G</text><text x="601" y="840" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Writable qcow2 overlay</text><text x="601" y="861" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">File lives in mainhost's filesystem.</text><text x="916" y="694" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">L2 | wk1 - worker</text><text x="931" y="749" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">2 vCPUs | 1500 MiB RAM</text><text x="931" y="770" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">k3s agent</text><text x="931" y="819" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Virtual root disk | 30G</text><text x="931" y="840" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Writable qcow2 overlay</text><text x="931" y="861" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">File lives in mainhost's filesystem.</text><text x="1246" y="694" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">L2 | wk2 - worker</text><text x="1261" y="749" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">2 vCPUs | 1500 MiB RAM</text><text x="1261" y="770" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">k3s agent</text><text x="1261" y="819" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Virtual root disk | 30G</text><text x="1261" y="840" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Writable qcow2 overlay</text><text x="1261" y="861" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">File lives in mainhost's filesystem.</text><text x="586" y="969" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">Kubernetes workload | PostgreSQL can be scheduled on a cluster node</text><text x="586" y="991" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Container path: /var/lib/postgresql/data  |  PGDATA: .../pgdata</text><text x="586" y="1013" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">PV/PVC -&gt; NFS export on lab, subdirectory taskmanager-postgres.</text><text x="586" y="1035" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Database files are outside mainhost and outside the node root disks.</text><text x="81" y="1159" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Green = persistent / shared data    Orange = writable VM overlays    Grey = cloud-init or host services</text><text x="81" y="1180" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Physical drive models, device names, and host OS disk capacity are not defined by the repository.</text></svg>
