[defaults]
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
timeout = 60
interpreter_python = auto_silent
deprecation_warnings=False
remote_tmp = /tmp/

[ssh_connection]
# SSH pipelining reduces round trips when running Ansible modules.
# This setting does not apply to network_cli connections.
pipelining = True
