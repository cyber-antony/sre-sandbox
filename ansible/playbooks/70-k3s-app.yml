---
- name: Render and manage application manifests on mainhost
  hosts: mainhosts
  gather_facts: false
  vars:
    app_name: "{{ k8s_app | default('taskmanager') }}"
    app_action: "{{ k8s_action | default('apply') }}"
    app_remote_dir: "/home/ansik/k8s-manifests/{{ app_name }}"
    app_sources: "{{ query('fileglob', playbook_dir ~ '/../../k8s/' ~ app_name ~ '/*.yaml') }}"

  tasks:
    - name: Validate application and action
      ansible.builtin.assert:
        that:
          - app_name is match('^[a-z0-9][a-z0-9_-]*$')
          - app_action in ['sync', 'apply', 'delete']
          - app_sources | length > 0

    - name: Ensure application manifest directory exists
      ansible.builtin.file:
        path: "{{ app_remote_dir }}"
        state: directory
        mode: "0755"

    - name: Render application manifests using the environment configuration
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ app_remote_dir }}/{{ item | basename }}"
        mode: "0600"
      loop: "{{ app_sources }}"

    - name: Manage each rendered manifest
      ansible.builtin.command:
        argv: "{{ ['kubectl', app_action, '-f', app_remote_dir ~ '/' ~ (item | basename)] + (['--ignore-not-found=true'] if app_action == 'delete' else []) }}"
      # Delete dependants before their namespace; apply the numbered files in order.
      loop: "{{ (app_sources | sort | reverse | list) if app_action == 'delete' else (app_sources | sort) }}"
      register: app_result
      changed_when: "app_result.stdout is search(' created| configured| deleted')"
      when: app_action != 'sync'
