---
- name: Export kubeconfig from control plane to mainhost
  hosts: control_plane
  become: true
  gather_facts: false
  serial: 1

  vars:
    k3s_kubeconfig_src: /etc/rancher/k3s/k3s.yaml
    k3s_api_server_ip: "{{ ansible_host }}"

  tasks:
    - name: Read kubeconfig from control plane
      ansible.builtin.slurp:
        src: "{{ k3s_kubeconfig_src }}"
      register: k3s_kubeconfig_raw

    - name: Read kubectl client version from control plane
      ansible.builtin.command:
        cmd: /usr/local/bin/kubectl version --client=true -o json
      register: k3s_kubectl_version_raw
      changed_when: false

    - name: Store kubeconfig content on mainhost
      # Replace the control-plane loopback address with an address mainhost can reach.
      ansible.builtin.set_fact:
        k3s_kubeconfig_content: >-
          {{
            (k3s_kubeconfig_raw.content | b64decode)
            | replace('https://127.0.0.1:6443', 'https://' ~ k3s_api_server_ip ~ ':6443')
          }}
        k3s_kubectl_version: >-
          {{
            ((k3s_kubectl_version_raw.stdout | from_json).clientVersion.gitVersion).split('+')[0]
          }}
      delegate_to: mainhost
      delegate_facts: true

- name: Install kubeconfig on mainhost
  hosts: mainhosts
  become: true
  gather_facts: false

  tasks:
    - name: Ensure ansik .kube directory exists
      ansible.builtin.file:
        path: /home/ansik/.kube
        state: directory
        owner: ansik
        group: ansik
        mode: "0700"

    - name: Write kubeconfig for ansik on mainhost
      ansible.builtin.copy:
        dest: /home/ansik/.kube/config
        content: "{{ hostvars['mainhost'].k3s_kubeconfig_content }}"
        owner: ansik
        group: ansik
        mode: "0600"

    - name: Ensure kubectl install directory exists on mainhost
      ansible.builtin.file:
        path: /usr/local/bin
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install kubectl on mainhost
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ hostvars['mainhost'].k3s_kubectl_version
          }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        owner: root
        group: root
        mode: "0755"

    - name: Ensure kubectl symlink exists on mainhost
      ansible.builtin.file:
        src: /usr/local/bin/kubectl
        dest: /usr/bin/kubectl
        state: link
