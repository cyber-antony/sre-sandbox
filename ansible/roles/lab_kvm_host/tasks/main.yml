---
- name: Install KVM/libvirt packages on lab host
  ansible.builtin.apt:
    name: "{{ lab_kvm_packages }}"
    state: present
    update_cache: true

- name: Ensure libvirt sockets are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - libvirtd.socket
    - libvirtd-ro.socket
    - libvirtd-admin.socket

- name: Ensure libvirtd service is enabled
  ansible.builtin.systemd:
    name: libvirtd.service
    enabled: true

- name: Ensure ansik is in libvirt group
  ansible.builtin.user:
    name: ansik
    groups: libvirt
    append: true

- name: Check KVM acceleration
  ansible.builtin.command: kvm-ok
  register: lab_kvm_ok
  changed_when: false
  failed_when: false

- name: Show KVM check output
  ansible.builtin.debug:
    var: lab_kvm_ok.stdout_lines
  when: lab_kvm_ok.stdout_lines is defined
