---
- name: Check whether k3s agent is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_service

- name: Read k3s join token from control plane
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_raw
  delegate_to: "{{ groups['control_plane'][0] }}"
  become: true

- name: Install k3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      {% if k3s_agent_version | length > 0 %}INSTALL_K3S_VERSION="{{ k3s_agent_version }}" {% endif %} \
      K3S_URL="{{ k3s_server_url }}" \
      K3S_TOKEN="{{ k3s_node_token_raw.content | b64decode | trim }}" \
      sh -
  args:
    executable: /bin/bash
  when: not k3s_agent_service.stat.exists

- name: Ensure k3s-agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
