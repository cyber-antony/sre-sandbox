---
- name: Install k3s prerequisite packages
  ansible.builtin.apt:
    name: "{{ k3s_prereq_packages }}"
    state: present
    update_cache: true

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: k3s_disable_swap
  changed_when: false

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^(?!#)(.*\\sswap\\s+.*)$"
    replace: "# \\1"
  when: k3s_disable_swap

- name: Ensure br_netfilter module loads on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      br_netfilter
      overlay

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Configure sysctl settings for k3s
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k3s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward=1
      net.bridge.bridge-nf-call-iptables=1
      net.bridge.bridge-nf-call-ip6tables=1
  notify: Reload sysctl
